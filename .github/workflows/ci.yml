name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps: 
        - name: Download Repo code
          uses: actions/checkout@v7
        - name: Setting Up Node JS
          uses: actions/setup-node@v7
          with:
            node-version: 24
            cache: npm
        - name: Install Dependancies
          run: npm ci
        - name: Lint
          run: npm run lint
        - name: test with coverage
          run: npm run coverage
        - name: Build 
          run: npm run build 
        - name: Save Build Output
          uses: actions/upload-artifact@v7
          with:
            name: site
            path: dist/

  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Get build output
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      # Wrap the tested dist as a prebuilt Vercel output so Vercel deploys it without rebuilding
      - name: Package build for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel (production)
        run: npx --yes vercel@65 deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

  deploy-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Get build output
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Package build for Vercel
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      # Without --prod this is a preview deploy; the CLI prints its URL on stdout
      - name: Deploy preview to Vercel
        id: preview
        run: |
          url=$(npx --yes vercel@65 deploy --prebuilt --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "Preview: ${{ steps.preview.outputs.url }}"

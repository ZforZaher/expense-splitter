name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps: 
        - name: Download Repo code
          uses: actions/checkout@v7
        - name: Setting Up Node JS
          uses: actions/setup-node@v7
          with:
            node-version: 24
            cache: npm
        - name: Install Dependancies
          run: npm ci
        - name: Lint
          run: npm run lint
        - name: test with coverage
          run: npm run coverage
        - name: Build 
          run: npm run build 
        - name: Save Build Output
          uses: actions/upload-artifact@v7
          with:
            name: site
            path: dist/

  deploy-production:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Get build output
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      # --no-build: deploy the exact dist that CI tested instead of rebuilding
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27 deploy --dir=dist --prod --no-build

  deploy-preview:
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get build output
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Deploy preview to Netlify
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27 deploy --dir=dist --no-build --alias=pr-${{ github.event.pull_request.number }} --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "Preview: ${{ steps.preview.outputs.url }}"
